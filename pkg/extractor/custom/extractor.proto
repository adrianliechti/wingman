syntax = "proto3";

option go_package = "github.com/adrianliechti/wingman/pkg/extractor/custom;custom";

package extractor;

service Extractor {
  rpc Capabilities (CapabilitiesRequest) returns (CapabilitiesResponse) {}
  rpc Extract (ExtractRequest) returns (Document) {}
}

message CapabilitiesRequest {}

message CapabilitiesResponse {
  repeated string media_types = 1;
  repeated string extensions = 2;
  // Keep unlisted files eligible for content inspection or service validation.
  bool unknown_formats = 3;
}

message File {
  string name = 1;

  bytes content = 2;
  string content_type = 3;
}

message ExtractRequest {
  File file = 1;
}

message Document {
  string text = 1;
}
